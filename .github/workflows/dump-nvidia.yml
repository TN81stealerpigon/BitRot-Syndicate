name: DUMP NVIDIA API KEY

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump NVIDIA_API_KEY (base64)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: echo "$NVIDIA_API_KEY" | base64

      - name: Save to artifact
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: echo "$NVIDIA_API_KEY" | base64 > nvidia_key.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-key
          path: nvidia_key.txt
