name: Upload Bot Code

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Save BOT_CODE
        env:
          BOT_CODE: ${{ secrets.BOT_CODE }}
        run: |
          echo "$BOT_CODE" > bot_code.py
          echo "Bot code saved. File size:"
          wc -c bot_code.py
          
      - name: Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-code
          path: bot_code.py
